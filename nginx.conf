# Disajikan oleh container `onboarding-merchant` (nginx:alpine).
# Satu origin: halaman statis di `/`, API pendaftaran diteruskan ke container `onboarding-api` lewat `/api/`.
# Karena satu origin & satu port, tidak perlu port kedua yang di-forward dan tidak ada CORS.
# Syarat: kedua container berada di jaringan docker yang sama (mis. `obm-net`).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://onboarding-api:8091/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://onboarding-api:8091/health;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
